# GitHub Actions workflow for Moodle plugin CI.
name: CI/CD Support

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2']
        moodle-branch: ['MOODLE_39_STABLE', 'MOODLE_400_STABLE', 'MOODLE_401_STABLE', 'MOODLE_405_STABLE']

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        with:
          path: qtype/attemptpassword

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pgsql, mysqli, gd, xml, intl, soap, zip
          ini-values: max_execution_time=600, memory_limit=512M
          tools: composer:v2

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^3
          echo "$(cd ci/bin; pwd)" >> $GITHUB_PATH
          echo "$(cd ci/vendor/bin; pwd)" >> $GITHUB_PATH

      # الحل النهائي هنا: تغيير اسم قاعدة البيانات لـ moodle_ci_db
      - name: Initialize moodle-plugin-ci
        run: |
          moodle-plugin-ci install --plugin qtype/attemptpassword --db-host=127.0.0.1 --db-user=postgres --db-name=moodle_ci_db --db-pass="" --db-type=pgsql
        env:
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: Moodle Code Checker
        run: moodle-plugin-ci codechecker qtype/attemptpassword

      - name: PHP Mass Detector
        run: moodle-plugin-ci phpmd qtype/attemptpassword

      - name: PHP Lint
        run: moodle-plugin-ci phplint qtype/attemptpassword

      - name: PHPUnit tests
        run: moodle-plugin-ci phpunit
